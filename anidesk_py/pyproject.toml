[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "anidesk"
version = "0.1.2"
description = "Windows local-first anime tracker built with PySide6"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6-Essentials==6.11.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "PyInstaller==6.22.0",
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
]

[project.scripts]
anidesk = "anidesk.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anidesk = ["resources/*.qss", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
